services:
  api:
    build: ./app
    ports:
      - "8000:8000"
    depends_on:
      - sample-site
      - sample-site-v2
    environment:
      # 容器网络内样本站地址（调用 API 时 catalog_url 用 http://sample-site:8080/）
      SAMPLE_CATALOG_URL: http://sample-site:8080/
      # 改版后的样本站（演示规则发布）
      SAMPLE_V2_CATALOG_URL: http://sample-site-v2:8080/
      # 规则持久化路径（挂在命名卷上，重启不丢）
      RULES_STORE_PATH: /data/rules.json
    volumes:
      - rules-data:/data

  sample-site:
    # 与 api 共用同一基础镜像，避免额外拉取镜像
    image: python:3.12-slim
    command: ["python", "-m", "http.server", "8080", "--directory", "/site"]
    volumes:
      - ./sample_site:/site:ro
    ports:
      - "8080:8080"

  sample-site-v2:
    # 供应商改版后的离线样例站（详情页换了新节点）
    image: python:3.12-slim
    command: ["python", "-m", "http.server", "8080", "--directory", "/site"]
    volumes:
      - ./sample_site_v2:/site:ro
    ports:
      - "8081:8080"

volumes:
  rules-data:
